[project]
name = "vinyl-ambient"
version = "0.1.0"
description = "Ambient music generator using slowed-down 78rpm vinyl samples from Internet Archive"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "pedalboard>=0.8.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
vinyl-ambient = "vinyl_ambient.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
